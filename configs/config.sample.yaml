project:
  name: rag-rfp
  seed: 42
data:
  meta_csv: data/data_list.csv
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
parsing:
  pdf:
    engine: "pymupdf"   # alt: "pdfminer"
  hwp:
    engine: "hwp5txt"   # alt: "pyhwp"
preprocess:
  normalize:
    keep_layout: false
    drop_headers_footers: true
  chunk:
    method: "semantic"
embeddings:
  provider: "openai"
  model: "text-embedding-3-large"
  batch_size: 128
index:
  backend: "chromadb"
  collection_name: "rfp_semantic_large"
  path: "./data/vectorstores/chroma_semantic"
retrieve:
  top_k: 5
  bm25_fallback: false
rerank:
  enabled: false
  model: "BAAI/bge-reranker-base"
generate:
  provider: "openai"
  model: "gpt-4.1-mini"
  max_tokens: 512
  temperature: 0.2
